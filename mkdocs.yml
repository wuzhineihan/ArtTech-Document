site_name: ArtTech Document
theme:
  name: material
  logo: assets/logo.jpg # 建议放置社团 logo
  favicon: assets/logo.jpg # 建议自定义 favicon
  features:
    # 导航相关功能
    - navigation.tabs # 顶级部分显示为标签页
    # - navigation.tabs.sticky       # 标签页在滚动时保持可见
    #- navigation.sections          # 顶级部分显示为组，适合大型文档
    #- navigation.expand            # 默认展开所有可折叠的子部分
    - navigation.path # 在页面顶部显示面包屑导航
    - navigation.prune # 只渲染可见的导航项，提高性能
    - navigation.indexes # 允许将文档直接附加到部分
    - navigation.top # 添加"回到顶部"按钮
    - navigation.footer # 在页脚显示上一页/下一页导航
    - navigation.tracking # 在URL中锚定标题，方便分享
      # 目录相关功能
    - toc.follow # 侧边栏目录跟随滚动
    # - toc.integrate                # 将目录集成到左侧导航栏

    # 搜索相关功能
    - search.highlight # 高亮搜索结果
    - search.share # 搜索结果分享按钮
    - search.suggest # 搜索建议

    # 内容相关功能
    - content.action.edit # 页面右上角"编辑此页"按钮
    - content.action.view # 页面右上角"查看源码"按钮
    - content.code.copy # 代码块一键复制按钮
    - content.code.select # 代码块选择功能
    - content.code.annotate # 代码注释功能
    - content.tabs.link # 链接内容标签页
    - content.tooltips # 工具提示功能
    - content.footnote.tooltips # 脚注工具提示

    # 标题相关功能
    # - header.autohide              # 向下滚动时自动隐藏标题栏
    # 公告横幅功能
    - announce.dismiss
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换夜间模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换日间模式
  font:
    text: Noto Sans SC
    code: Fira Mono
  language: zh
  extra_javascript:
    - assets/javascripts/toc_toggle.js

nav:
  - 首页: index.md
  - 社团介绍:
      - 社团简介: 社团介绍/社团介绍.md
      - 社团运行机制: 社团介绍/社团运行机制.md
      - 成员介绍: 社团介绍/成员.md
  - 游戏开发技术:
      - UE:
          - UE入门: 游戏开发技术/UE/UE入门.md
          - UE基础·基本类: 游戏开发技术/UE/UE基础·基本类.md
          - UE进阶: 游戏开发技术/UE/UE进阶.md
      - Unity:
          - Unity入门: 游戏开发技术/Unity/Unity入门.md
          - Unity基础·生命周期篇: 游戏开发技术/Unity/Unity基础·生命周期篇.md
          - Unity基础·Component篇: 游戏开发技术/Unity/Unity基础·Component篇.md
          - Unity基础·自建框架篇: 游戏开发技术/Unity/Unity基础·自建框架篇.md
          - C#编程能力进阶: 游戏开发技术/Unity/csharp编程能力进阶.md
      - Unity渲染:
          - Unity美术基础: 游戏开发技术/Unity渲染/Unity美术基础.md
          - URP相关配置介绍: 游戏开发技术/Unity渲染/URP相关配置介绍.md
          - 用github备份Unity项目: 游戏开发技术/Unity渲染/用github备份Unity项目.md
      - C++基础: 游戏开发技术/Cpp.md
      - 游戏设计模式: 游戏开发技术/游戏设计模式.md
  - 项目信息:
      - 蜀祭·太初: 项目信息/蜀祭·太初.md
      - 食几何时: 项目信息/食几何时.md
      - 浮生之路: 项目信息/浮生之路.md
  - 活动信息:
      - 常驻活动:
          - 游戏沙龙: 活动信息/常驻活动/游戏沙龙.md
          - DemoDay: 活动信息/常驻活动/DemoDay.md
          - 社团招新: 活动信息/常驻活动/社团招新.md
      - 开发活动:
          - ArtTech 30 Day Prototype 2025: 活动信息/开发活动/ArtTech 30 Day Prototype 2025.md
          - NAGO GameJam 2025 艺数盒子站: 活动信息/开发活动/NAGO GameJam 2025 艺数盒子站.md
      - 讲座活动:
          - 25年招新宣讲: 活动信息/讲座活动/25年招新宣讲.md
          - 1001夜技术分享: 活动信息/讲座活动/1001夜技术分享.md
          - 24年招新宣讲: 活动信息/讲座活动/24年招新宣讲.md
      - 其他活动:
          - 24年线下破冰: 活动信息/其他活动/24年线下破冰.md
      - 25年深圳文博会: 活动信息/25年深圳文博会.md
  - 其他:
      - 常用工具网站: 其他/常用工具网站.md
      - AI工具使用指北: 其他/AI工具使用指北.md
      - 常见问题: 其他/常见问题.md
      - 机核节目推荐: 其他/机核节目推荐.md
      - 如何为本网站做出贡献: 其他/如何为本网站做出贡献.md
      # 如有更多页面可继续添加

plugins:
  - search

markdown_extensions:
  - nl2br
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
